<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>معرض الأعمال | مكتبة الزعيم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            <span>مكتبة الزعيم</span>
        </div>

        <div class="header-actions">

            <button
                id="themeBtn"
                class="icon-btn"
                title="تغيير الوضع"
            >
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <span class="hero-small">
            شوف شغلنا
        </span>

        <h1>
            معرض الأعمال
        </h1>

        <p>
            اختار القسم وشوف أعمالنا
        </p>

    </section>


    <!-- =========================
         FILTERS
    ========================== -->

    <section class="gallery-section">

        <div
            class="filters"
            id="filters"
        >
            <!-- الأزرار يتم إنشاؤها تلقائياً -->
        </div>


        <!-- =========================
             GALLERY
        ========================== -->

        <div
            class="gallery-grid"
            id="galleryGrid"
        >

            <div class="loading">

                <div class="loader"></div>

                <h3>
                    جاري تحميل الأعمال
                </h3>

                <p>
                    انتظر لحظة...
                </p>

            </div>

        </div>

    </section>


    <!-- =========================
         LIGHTBOX
    ========================== -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            class="lightbox-close"
            id="lightboxClose"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>


        <button
            class="lightbox-arrow right"
            id="prevBtn"
        >
            <i class="fa-solid fa-chevron-right"></i>
        </button>


        <div class="lightbox-center">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >

            <div
                class="lightbox-info"
                id="lightboxInfo"
            ></div>

        </div>


        <button
            class="lightbox-arrow left"
            id="nextBtn"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <p>
            © 2026 مكتبة الزعيم - جميع الحقوق محفوظة
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
